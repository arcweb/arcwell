name: Server CI Pipeline

on:
  pull_request:

env:
  COMPOSE_FILE: ./compose.ci.yml
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server/${{ github.ref_name }}:latest
  ADMIN_IMAGE: ghcr.io/${{ github.repository }}/admin/${{ github.ref_name }}:latest

  APP_KEY: NOT_AN_REAL_APP_KEY
  ARCWELL_INSTANCE_ID: arcweb-ci
  ARCWELL_INSTANCE_NAME: CI Arcwell Server"
  ARCWELL_KEY: "LOCAL-DEV-SERVER"
  ARCWELL_NODE: "Arcweb/Dev-Node"
  ARCWELL_REGISTER_ENABLED: true
  ARCWELL_SERVER_CORS_ORIGINS: "http://localhost:4200,0.0.0.0:4200,127.0.0.1:4200,http://localhost:3333"
  ARCWELL_SERVER_DEBUG_ERRORS: false
  DB_DATABASE: arcwell_test
  DB_HOST: db
  DB_PASSWORD: arcwell
  DB_PORT: 5432
  DB_USER: arcwell
  HOST: 0.0.0.0
  LOG_LEVEL: info
  NODE_ENV: development
  PORT: 3333
  SMTP_FROM_ADDRESS: arcwell@example.com
  SMTP_FROM_NAME: "Arcwell Admin"
  SMTP_HOST: mailpit
  SMTP_PASSWORD: arcwell
  SMTP_PORT: 1025
  SMTP_USER: arcwell
  TZ: UTC

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      server: ${{ steps.filter.outputs.server }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: csv
          filters: |
            server:
              - 'packages/server/**'

  build-server-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/server
          file: ./packages/server/Dockerfile
          target: develop
          build-args: |
            NODE_ENV=development
            PORT=3333
          push: true
          tags: ${{ env.SERVER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Containers
        run: docker compose up server -d
    
      - name: Verify Container Health
        run: |
          set -e
          echo "Waiting for containers to become healthy..."

          timeout=120
          while [ $timeout -gt 0 ]; do
            # Check the health status of all containers
            if ! docker compose ps -q | xargs docker inspect --format='{{.State.Health.Status}}' | grep -q 'unhealthy'; then
              echo "All services are healthy."
              exit 0
            fi

            echo "At least one service is not yet healthy. Retrying..."
            sleep 10
            timeout=$((timeout - 10))
          done

          echo "Error: Not all services became healthy in time."
          exit 1

      - name: Lint Server
        run: |
          docker compose exec server npm run lint

      - name: Test Server
        run: |
          docker compose exec server npm run test
