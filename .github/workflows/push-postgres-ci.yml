name: Push Postgres Image to GHCR

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:     # Allows manual triggering

permissions:
  contents: read
  packages: write

permissions:
  contents: read
  packages: write

jobs:
  push-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Postgres Image from Docker Hub
        run: docker pull postgres:16-bookworm

      - name: Pull Postgres Image from GHCR (if exists)
        run: docker pull ghcr.io/${{ github.repository }}/postgres:16-bookworm || true

      - name: Check for Image Updates
        id: check_updates
        run: |
          set -e
          # Get the digest of the image from GHCR (local)
          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/postgres:16-bookworm 2>/dev/null || echo "")
          # Get the digest of the image from Docker Hub (remote)
          REMOTE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' postgres:16-bookworm)
          echo "local_digest=$LOCAL_DIGEST" >> $GITHUB_OUTPUT
          echo "remote_digest=$REMOTE_DIGEST" >> $GITHUB_OUTPUT
          if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ] && [ -n "$LOCAL_DIGEST" ]; then
            echo "No updates available for postgres:16-bookworm."
            echo "update_available=false" >> $GITHUB_OUTPUT
          else
            echo "Updates available for postgres:16-bookworm."
            echo "update_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag Image for GHCR
        run: docker tag postgres:16-bookworm ghcr.io/${{ github.repository }}/postgres:16-bookworm

      - name: Push Image to GHCR
        if: steps.check_updates.outputs.update_available == 'true' || github.event_name == 'workflow_dispatch'
        run: docker push ghcr.io/${{ github.repository }}/postgres:16-bookworm
