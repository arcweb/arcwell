name: Push Postgres Image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Postgres Image from Docker Hub
        run: docker pull postgres:16-bookworm

      - name: Tag Image for GHCR
        run: docker tag postgres:16-bookworm ghcr.io/${{ github.repository }}/postgres:16-bookworm

      - name: Push Image to GHCR
        run: docker push ghcr.io/${{ github.repository }}/postgres:16-bookworm
