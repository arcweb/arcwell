name: Admin CI Pipeline

on:
  pull_request:

env:
  COMPOSE_FILE: ./compose.ci.yml
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server/${{ github.ref_name }}:latest
  ADMIN_IMAGE: ghcr.io/${{ github.repository }}/admin/${{ github.ref_name }}:latest

  APP_KEY: NOT_AN_REAL_APP_KEY
  ARCWELL_INSTANCE_ID: arcweb-ci
  ARCWELL_INSTANCE_NAME: CI Arcwell Server"
  ARCWELL_KEY: "LOCAL-DEV-SERVER"
  ARCWELL_NODE: "Arcweb/Dev-Node"
  ARCWELL_REGISTER_ENABLED: true
  ARCWELL_SERVER_CORS_ORIGINS: "http://localhost:4200,0.0.0.0:4200,127.0.0.1:4200,http://localhost:3333"
  ARCWELL_SERVER_DEBUG_ERRORS: false
  DB_DATABASE: arcwell_test
  DB_HOST: db
  DB_PASSWORD: arcwell
  DB_PORT: 5432
  DB_USER: arcwell
  HOST: 0.0.0.0
  LOG_LEVEL: info
  NODE_ENV: development
  PORT: 3333
  SMTP_FROM_ADDRESS: arcwell@example.com
  SMTP_FROM_NAME: "Arcwell Admin"
  SMTP_HOST: mailpit
  SMTP_PASSWORD: arcwell
  SMTP_PORT: 1025
  SMTP_USER: arcwell
  TZ: UTC

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      admin: ${{ steps.filter.outputs.admin }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: csv
          filters: |
            admin:
              - 'packages/admin/**'

  build-admin-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/admin
          file: ./packages/admin/Dockerfile
          target: develop
          build-args: |
            NODE_ENV=development
            PORT=4200
          push: true
          tags: ${{ env.ADMIN_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Containers
        run: docker compose up -d
  
      - name: Verify Container Health
        run: |
          set -e
          echo "Waiting for containers to become healthy..."

          # Wait for initial healthcheck to run
          sleep 15

          # Perform the first health check
          if docker compose ps -q | xargs docker inspect --format='{{.State.Health.Status}}' | grep -q 'unhealthy'; then
            echo "Some services are still unhealthy. Retrying after 60 seconds..."
            sleep 60

            # Perform the second health check
            if docker compose ps -q | xargs docker inspect --format='{{.State.Health.Status}}' | grep -q 'unhealthy'; then
              echo "Error: Not all services became healthy in time."
              exit 1
            fi
          fi

          echo "All services are healthy."
          exit 0

      - name: Lint Admin
        run: |
          docker compose exec admin npm run lint

      # TODO: Temporarily commenting this out until ARCWELL-387 "Implement Admin unit testing is completed"
#      - name: Test Server
#        run: |
#          docker compose exec admin ng test --watch=false


      - name: Cypress Test - Components
        run: |
          docker compose exec admin npx cypress run --component --browser chromium
