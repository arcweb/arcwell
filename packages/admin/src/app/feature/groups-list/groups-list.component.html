<aw-table-header
  [tableName]="featureStore.activeSubfeature()?.name || 'Groups'"
  [enableFilter]="
    groupsListStore.groups().length > 0 || groupsListStore.search().length > 0
  "
  [enableImport]="false"
  (onSearchTextChanged)="searchTextChanged($event)"
></aw-table-header>

@if (groupsListStore.isErrored()) {
  <aw-error-container [errors]="groupsListStore.errors()" />
}

@if (groupsListStore.groups().length > 0) {
  <div class="table-form-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Path Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="handleClick(row)"
      ></tr>
    </table>

    <mat-paginator
      [length]="groupsListStore.totalData()"
      [pageSizeOptions]="pageSizes"
      [pageSize]="groupsListStore.limit()"
      [pageIndex]="groupsListStore.pageIndex()"
      (page)="this.groupsListStore.loadPage($event)"
      showFirstLastButtons="true"
    ></mat-paginator>
  </div>
} @else {
  <aw-no-records></aw-no-records>
}
