<aw-table-header
  [tableName]="'All Users'"
  [enableFilter]="
    userStore.users().length > 0 ||
    userStore.search().length > 0 ||
    userStore.filters().length > 0
  "
  (onSearchTextChanged)="searchTextChanged()"
  (onFiltersChanged)="filtersChanged()"
  (onFiltersCleared)="filtersCleared()"
></aw-table-header>

@if (userStore.isErrored()) {
  <aw-error-container [errors]="userStore.errors()" />
}
@if (userStore.users().length > 0) {
  <div class="table-form-container">
    <aw-users-table
      [dataSource]="dataSource"
      [displayedColumns]="displayedColumns"
      [length]="this.userStore.totalData()"
      [pageSizes]="pageSizes"
      [pageSize]="this.userStore.limit()"
      [pageIndex]="this.userStore.pageIndex()"
      (onPageChanged)="this.userStore.loadPage($event)"
      (onRowClicked)="rowClick($event)"
      (onViewPersonClicked)="viewPerson($event)"
      (onReInvite)="reinvite($event)"
    ></aw-users-table>
  </div>
} @else {
  <aw-no-records></aw-no-records>
}
