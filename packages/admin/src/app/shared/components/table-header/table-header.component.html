<div class="main-container-header">
  <h4 class="font-weight-light">
    {{ tableName() }}
  </h4>
  <div class="icons-container" #trigger="cdkOverlayOrigin" cdkOverlayOrigin>
    <button
      mat-button
      (click)="onCreate()"
      matTooltip="Add new"
      class="table-header-button label-medium font-weight-regular"
    >
      <fa-icon
        aria-label="Add new icon button"
        class="table-header-button-icon"
        [icon]="faCirclePlus"
        size="xl"
      ></fa-icon>
      Add New
    </button>
    @if (enableFilter()) {
      <button
        mat-button
        matTooltip="Filter"
        (click)="filterOpen = !filterOpen"
        class="table-header-button label-medium font-weight-regular"
        [matBadge]="activeFilterCount()"
        [matBadgeHidden]="activeFilterCount() < 1"
      >
        <fa-icon
          aria-label="Filter icon button"
          class="table-header-button-icon"
          [icon]="faBars"
          size="xl"
        ></fa-icon>
        Filter
      </button>
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="filterOpen"
        [cdkConnectedOverlayOffsetX]="filterOffsetX"
        [cdkConnectedOverlayWidth]="filterWidth"
      >
        <aw-feature-search-and-filter
          class="filter-overlay"
          (onSearchTextChanged)="searchTextChanged()"
          (onFiltersChanged)="filtersChanged()"
          (onCleared)="filtersCleared()"
        ></aw-feature-search-and-filter>
      </ng-template>
    }
    @if (enableImport()) {
      <div matTooltip="bulk import">
        <button
          mat-button
          matTooltip="bulk import"
          class="table-header-button label-medium font-weight-regular"
          (click)="bulkInput.emit()"
        >
          <fa-icon
            aria-label="Bulk import button"
            class="table-header-button-icon"
            [icon]="faFileImport"
            size="xl"
          ></fa-icon>
          Import
        </button>
      </div>
    }
  </div>
</div>
