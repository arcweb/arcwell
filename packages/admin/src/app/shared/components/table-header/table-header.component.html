<div class="main-container-header">
  <h4 class="font-weight-light">
    {{ tableName() }}
  </h4>
  <div class="icons-container" #trigger="cdkOverlayOrigin" cdkOverlayOrigin>
    <button
      mat-button
      (click)="onCreate()"
      matTooltip="Add new"
      class="table-header-button label-medium font-weight-regular"
    >
      <fa-icon
        aria-label="Add new icon button"
        class="table-header-button-icon"
        [icon]="faCirclePlus"
        size="xl"
      ></fa-icon>
      Add New
    </button>
    @if (enableFilter()) {
      <!-- TODO: Remove disabling of button from Events and Facts once we have any filter developed -->
      <button
        mat-button
        matTooltip="Filter"
        (click)="filterOpen = !filterOpen"
        [disabled]="
          (featureSearchAndFilterStore.currentFeature() === 'events' ||
            featureSearchAndFilterStore.currentFeature() === 'facts') &&
          featureSearchAndFilterStore.currentSubFeature() !== 'types'
        "
        class="table-header-button label-medium font-weight-regular"
        [ngClass]="{
          disabled:
            (featureSearchAndFilterStore.currentFeature() === 'events' ||
              featureSearchAndFilterStore.currentFeature() === 'facts') &&
            featureSearchAndFilterStore.currentSubFeature() !== 'types',
        }"
        [matBadge]="activeFilterCount()"
        [matBadgeHidden]="activeFilterCount() < 1"
      >
        <fa-icon
          aria-label="Filter icon button"
          class="table-header-button-icon"
          [icon]="faBars"
          size="xl"
        ></fa-icon>
        Filter
      </button>
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="filterOpen"
        [cdkConnectedOverlayPositions]="[
          {
            originX: 'end',
            originY: 'bottom',
            overlayX: 'end',
            overlayY: 'top',
          },
        ]"
        [cdkConnectedOverlayOffsetY]="filterOffsetY"
      >
        <aw-feature-search-and-filter
          (onSearchTextChanged)="searchTextChanged($event)"
        ></aw-feature-search-and-filter>
      </ng-template>
    }
    @if (enableImport()) {
      <div matTooltip="bulk import">
        <button
          mat-button
          matTooltip="bulk import"
          class="table-header-button label-medium font-weight-regular"
          (click)="bulkInput.emit()"
        >
          <fa-icon
            aria-label="Bulk import button"
            class="table-header-button-icon"
            [icon]="faFileImport"
            size="xl"
          ></fa-icon>
          Import
        </button>
      </div>
    }
    @if (enableImport()) {
      <div matTooltip="bulk import">
        <button
          mat-button
          matTooltip="bulk import"
          class="table-header-button label-medium font-weight-regular"
          (click)="bulkInput.emit()"
        >
          <fa-icon
            aria-label="Bulk import button"
            class="table-header-button-icon"
            [icon]="faFileImport"
            size="xl"
          ></fa-icon>
          Import
        </button>
      </div>
    }
  </div>
</div>
